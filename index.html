<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fuel Tracer</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/RVH44Qpd/Fuel-Tracer-App.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/RVH44Qpd/Fuel-Tracer-App.png">
    
    <style>
        :root {
            /* Pure AMOLED Black & Neon Blue */
            --bg-dark: #000000; 
            --surface: #09090b; 
            --border: #1a1a24;
            --text-main: #f4f4f5; 
            --text-muted: #8b8b99; 
            --accent: #00eeff; 
            --accent-hover: #00c3d4;
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b;
            --mobile-nav-h: 72px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        
        body { font-family: 'Outfit', sans-serif; color: var(--text-main); margin: 0; background: var(--bg-dark); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden; width: 100vw; touch-action: manipulation; }
        
        @keyframes slideUpFade { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes slideIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:translateX(0); } }

        /* ── TOAST & LOADER ── */
        #toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:rgba(16,185,129,0.95); backdrop-filter:blur(12px); color:white; padding:14px 28px; border-radius:28px; box-shadow:0 8px 28px rgba(16,185,129,0.35); z-index:100000; transition:all 0.3s var(--ease); font-weight:600; font-size:14px; opacity:0; pointer-events:none; }
        #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
        #toast.toast-error { background:rgba(239,68,68,0.95); box-shadow:0 8px 28px rgba(239,68,68,0.35); }
        
        #loader { position:fixed; inset:0; display:none; flex-direction:column; justify-content:center; align-items:center; z-index:99999; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); color:var(--text-main); }
        .spinner { width:40px; height:40px; border:4px solid rgba(0,238,255,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin-bottom:15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── LOGIN ── */
        #login-container { display:block; width:100%; max-width:400px; text-align:center; background:var(--surface); border:1px solid var(--border); padding:44px 32px; border-radius:28px; margin-top:10vh; box-shadow:0 24px 60px rgba(0,238,255,0.05); animation:slideUpFade 0.5s var(--ease); }
        body.is-logged-in #login-container { display:none !important; }
        #login-container h2 { margin:0 0 24px; font-weight:700; font-size:26px; color:var(--accent); text-shadow: 0 0 10px rgba(0,238,255,0.3); }

        /* ── INPUTS & BUTTONS ── */
        input[type="text"], input[type="password"], input[type="number"], select { width:100%; padding:16px 20px; margin:8px 0; border-radius:14px; border:1px solid var(--border); background:var(--bg-dark); color:var(--text-main); font-family:'Outfit'; font-size:16px !important; transition:all 0.25s var(--ease); }
        input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow: 0 0 0 2px rgba(0,238,255,0.15); }
        
        .btn-main { width:100%; padding:16px; background:var(--accent); color:#000; font-weight:700; border:none; border-radius:14px; font-size:16px; cursor:pointer; margin-top:14px; transition:all 0.2s var(--ease); box-shadow: 0 4px 15px rgba(0,238,255,0.25); }
        .btn-main:active { transform:translateY(2px) scale(0.98); }
        .btn-main:disabled { opacity:0.6; cursor:not-allowed; }

        /* ── NAV & VIEWS ── */
        #mobile-bottom-nav { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(9,9,11,0.95); backdrop-filter:blur(10px); border-top:1px solid var(--border); padding:10px 10px calc(10px + env(safe-area-inset-bottom)); justify-content:space-around; z-index:1000; }
        body.is-logged-in #mobile-bottom-nav { display:flex; }
        
        .mob-nav-item { display:flex; flex-direction:column; align-items:center; padding:8px 12px; border-radius:16px; cursor:pointer; color:var(--text-muted); gap:4px; transition:all 0.2s; -webkit-tap-highlight-color:transparent; }
        .mob-nav-item svg { width:24px; height:24px; }
        .mob-nav-item span { font-size:11px; font-weight:600; }
        .mob-nav-item.active { color:var(--accent); text-shadow: 0 0 8px rgba(0,238,255,0.4); }
        .mob-nav-item.hidden { display:none !important; }

        .app-container { width:100%; max-width:500px; display:none; animation:slideUpFade 0.5s var(--ease); }
        body.is-logged-in .app-container { display: block; }
        .view-section { padding:24px 20px calc(24px + var(--mobile-nav-h)); display:none; opacity:0; transform:translateX(10px); }
        .view-section.active { display:block; opacity:1; transform:translateX(0); animation:slideIn 0.3s var(--ease) forwards; }

        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .header h1 { margin:0; font-size:24px; font-weight:700; color:var(--text-main); }
        .user-badge { font-size:12px; font-weight:600; padding:6px 14px; border-radius:18px; border:1px solid var(--border); background:var(--surface); color:var(--accent); }

        /* ── CARDS & MODALS ── */
        .card { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); padding:16px; border-radius:16px; margin-bottom:12px; position:relative; }
        .card h4 { margin:0 0 4px; font-size:16px; color:var(--text-main); }
        .card p { margin:4px 0; font-size:13px; color:var(--text-muted); }
        .edit-badge { position:absolute; top:16px; right:16px; font-size:12px; padding:4px 10px; border-radius:8px; border:1px solid var(--border); cursor:pointer; color:var(--text-muted); }
        
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); z-index:10000; justify-content:center; align-items:center; }
        .modal-content { background:var(--surface); padding:24px; border-radius:24px; width:90%; max-width:400px; border:1px solid var(--border); }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><h3 id="loader-msg" style="margin:0; font-weight:500;">Loading...</h3></div>
<div id="toast"><span id="toast-msg"></span></div>

<div id="login-container">
    <img src="https://i.postimg.cc/RVH44Qpd/Fuel-Tracer-App.png" alt="Logo" style="width:90px; height:90px; border-radius:20px; margin-bottom:16px; box-shadow: 0 0 20px rgba(0,238,255,0.2);">
    <h2>Fuel Tracer</h2>
    <input type="text" id="login-user" placeholder="Username" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus();">
    <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')handleLogin();">
    <button type="button" class="btn-main" id="btn-login-submit" onclick="handleLogin()">Ignition (Log In)</button>
    <p id="login-msg" style="color:var(--danger);font-size:14px;margin-top:16px;font-weight:500;"></p>
</div>

<div class="app-container" id="main-app">
    <div class="header" style="padding: 24px 20px 16px;">
        <h1 id="page-title">Entry</h1>
        <div style="display:flex; gap:10px; align-items:center;">
            <span class="user-badge" id="display-user">--</span>
            <button onclick="logout()" style="background:transparent; border:none; color:var(--text-muted); padding:5px; cursor:pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
    </div>

    <div id="view-entry" class="view-section active">
        <label style="font-size:14px;color:var(--text-muted);margin-bottom:8px;display:block;">Select Vehicle</label>
        <select id="entry-vehicle" style="margin-bottom:24px;"></select>

        <div style="display:flex; gap:10px; margin-bottom: 24px;">
            <button class="btn-main" id="btn-type-fuel" style="margin-top:0;" onclick="setEntryType('FUELING')">⛽ Fueling</button>
            <button class="btn-main" id="btn-type-res" style="margin-top:0; background:transparent; border:1px solid var(--border); color:var(--text-muted); box-shadow:none;" onclick="setEntryType('RESERVE')">⚠️ Reserve Hit</button>
        </div>
        <input type="hidden" id="entry-type" value="FUELING">
        
        <label style="font-size:14px;color:var(--text-muted);margin-bottom:8px;display:block;">Odometer Reading (km)</label>
        <input type="number" id="entry-odo" placeholder="e.g. 15420">
        
        <div id="entry-amount-container">
            <label style="font-size:14px;color:var(--text-muted);margin-top:16px;margin-bottom:8px;display:block;">Amount Paid (₹)</label>
            <input type="number" id="entry-amount" placeholder="e.g. 500">
            <p id="live-liters-calc" style="font-size:12px; color:var(--accent); margin-top:8px;">Estimated: 0.00 L (at ₹<span id="display-price">--</span>/L)</p>
        </div>
        <button class="btn-main" id="btn-submit-entry" onclick="submitEntry()" style="margin-top:32px;">Log Entry</button>
    </div>

    <div id="view-history" class="view-section">
        <button class="btn-main" style="margin-top:0; margin-bottom:16px; background:var(--surface); border:1px solid var(--accent); color:var(--accent); box-shadow:none;" onclick="fetchInitData()">🔄 Refresh History</button>
        <div id="history-list"></div>
    </div>

    <div id="view-dashboard" class="view-section">
        <div class="card" style="border-left-color:var(--success);">
            <h4 style="color:var(--success);">Mileage Calculator</h4>
            <p>Calculates km/l between the two most recent "Reserve" hits.</p>
            <h2 id="dash-mileage" style="margin:10px 0; font-size:32px; color:var(--text-main);">-- km/l</h2>
            <p id="dash-mileage-sub" style="font-size:12px; color:var(--text-muted);">Awaiting data...</p>
        </div>
    </div>

    <div id="view-admin" class="view-section">
        <div class="card">
            <h4 style="color:var(--warning);">Global Fuel Price</h4>
            <p>Update this when pump prices change.</p>
            <input type="number" id="admin-price" step="0.01" placeholder="Current Price">
            <button class="btn-main" style="padding:12px; background:var(--warning); color:#000;" onclick="updateFuelPrice()">Update Price</button>
        </div>
    </div>
</div>

<div class="modal" id="edit-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--accent);">Edit Record</h3>
        <input type="hidden" id="edit-id">
        <label style="color:var(--text-muted);font-size:13px;">Odometer</label>
        <input type="number" id="edit-odo">
        <label style="color:var(--text-muted);font-size:13px;margin-top:10px;">Amount Paid (₹)</label>
        <input type="number" id="edit-amt">
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-main" style="background:transparent; border:1px solid var(--border); color:var(--text-muted); box-shadow:none;" onclick="document.getElementById('edit-modal').style.display='none'">Cancel</button>
            <button class="btn-main" onclick="saveEdit()">Save Edit</button>
        </div>
    </div>
</div>

<nav id="mobile-bottom-nav">
    <div class="mob-nav-item active" id="nav-entry" onclick="navTo('entry')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22v-8c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v8"/><path d="M14 22V4c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>
        <span>Entry</span>
    </div>
    <div class="mob-nav-item" id="nav-history" onclick="navTo('history')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>History</span>
    </div>
    <div class="mob-nav-item" id="nav-dashboard" onclick="navTo('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Dashboard</span>
    </div>
    <div class="mob-nav-item" id="nav-admin" onclick="navTo('admin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Admin</span>
    </div>
</nav>

<script>
    // ⚠️ DEPLOY APPS SCRIPT AND PASTE URL BELOW:
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbyiELKtJjEdbvszLx0GWxncUSa_ckAnRigE3LTc785aIW5X_-tx-p8Os05DT-sC4ud6lQ/exec";

    let currentUser = { username:'', role:'', token:'' };
    let toastQueue = []; let isToastShowing = false;
    let globalFuelPrice = 0; let globalVehicles = []; let globalHistory = [];

    function showToast(msg, type='success') { toastQueue.push({msg, type}); processToastQueue(); }
    function processToastQueue() {
        if(isToastShowing || toastQueue.length===0) return;
        isToastShowing = true; const {msg, type} = toastQueue.shift();
        const t = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        t.className = ''; if(type==='error') t.classList.add('toast-error');
        t.classList.add('show');
        setTimeout(() => { t.classList.remove('show'); setTimeout(()=>{isToastShowing=false; processToastQueue();}, 400); }, 3000);
    }
    function showLoader(msg="Loading...") { document.getElementById('loader-msg').innerText=msg; document.getElementById('loader').style.display='flex'; }
    function hideLoader() { document.getElementById('loader').style.display='none'; }

    const PAGE_TITLES = { entry:'Log Entry', history:'Log History', dashboard:'Dashboard', admin:'Admin Settings' };
    function navTo(tabId) {
        document.querySelectorAll('.view-section').forEach(v=>v.classList.remove('active'));
        document.getElementById('view-'+tabId).classList.add('active');
        document.querySelectorAll('.mob-nav-item').forEach(i=>i.classList.remove('active'));
        document.getElementById('nav-'+tabId).classList.add('active');
        document.getElementById('page-title').innerText = PAGE_TITLES[tabId];
    }

    async function callGoogleAPI(payload) {
        if (payload.action !== 'login' && currentUser.token) { payload._token = currentUser.token; payload._u = currentUser.username; }
        try {
            const res = await fetch(GOOGLE_API_URL, { method:'POST', body:JSON.stringify(payload) });
            const data = await res.json();
            if(data.status==='error' && data.message.includes('expired')) { showToast('Session expired.', 'error'); logout(); }
            return data;
        } catch(e) { return {status:'error', message:'Network error.'}; }
    }

    async function handleLogin() {
        if (GOOGLE_API_URL === "YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE") return showToast('Add API URL in code', 'error');
        const u = document.getElementById('login-user').value.trim(), p = document.getElementById('login-pass').value.trim();
        if(!u||!p) return;
        document.getElementById('btn-login-submit').disabled=true; showLoader('Verifying...');
        const res = await callGoogleAPI({action:'login', username:u, password:p});
        hideLoader(); document.getElementById('btn-login-submit').disabled=false;
        if(res.status==='success') {
            localStorage.setItem('ft_user', JSON.stringify({username:res.username, role:res.role, token:res.token, expires:Date.now()+(5.5*3600000)}));
            startApp();
        } else { document.getElementById('login-msg').innerText = res.message; }
    }
    function logout() { localStorage.removeItem('ft_user'); location.reload(); }

    function startApp() {
        const saved = localStorage.getItem('ft_user');
        if(saved) {
            const p = JSON.parse(saved);
            if(Date.now() > p.expires) return logout();
            currentUser = p; document.body.classList.add('is-logged-in');
            document.getElementById('display-user').innerText = `${p.username} (${p.role})`;
            if(p.role !== 'Admin') document.getElementById('nav-admin').classList.add('hidden');
            navTo('entry'); fetchInitData();
            if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
        }
    }

    async function fetchInitData() {
        showLoader('Syncing...');
        const res = await callGoogleAPI({action:'getInitData'});
        hideLoader();
        if(res.status === 'success') {
            globalFuelPrice = res.currentPrice; globalVehicles = res.vehicles; globalHistory = res.history;
            document.getElementById('display-price').innerText = globalFuelPrice.toFixed(2);
            document.getElementById('admin-price').value = globalFuelPrice.toFixed(2);
            document.getElementById('entry-vehicle').innerHTML = globalVehicles.map(v=>`<option value="${v.id}">${v.name}</option>`).join('');
            renderHistory(); calculateMileage();
        }
    }

    document.getElementById('entry-amount').addEventListener('input', (e) => {
        const amt = parseFloat(e.target.value)||0;
        document.getElementById('live-liters-calc').innerText = `Estimated: ${(globalFuelPrice>0?amt/globalFuelPrice:0).toFixed(2)} L (at ₹${globalFuelPrice.toFixed(2)}/L)`;
    });

    function setEntryType(type) {
        document.getElementById('entry-type').value = type;
        const bF = document.getElementById('btn-type-fuel'), bR = document.getElementById('btn-type-res'), aC = document.getElementById('entry-amount-container');
        if(type==='FUELING') {
            bF.style.background='var(--accent)'; bF.style.color='#000'; bF.style.boxShadow='0 4px 15px rgba(0,238,255,0.25)'; bF.style.border='none';
            bR.style.background='transparent'; bR.style.color='var(--text-muted)'; bR.style.boxShadow='none'; bR.style.border='1px solid var(--border)';
            aC.style.display='block';
        } else {
            bR.style.background='rgba(245,158,11,0.15)'; bR.style.color='var(--warning)'; bR.style.border='1px solid var(--warning)';
            bF.style.background='transparent'; bF.style.color='var(--text-muted)'; bF.style.boxShadow='none'; bF.style.border='1px solid var(--border)';
            aC.style.display='none';
        }
    }

    async function submitEntry() {
        const type = document.getElementById('entry-type').value, vId = document.getElementById('entry-vehicle').value;
        const odo = document.getElementById('entry-odo').value, amt = document.getElementById('entry-amount').value;
        if(!vId||!odo||(type==='FUELING'&&!amt)) return showToast('Fill all fields', 'error');
        showLoader('Logging...');
        const res = await callGoogleAPI({action:'logEntry', vehicleId:vId, logType:type, odoReading:odo, amountPaid:type==='FUELING'?amt:0});
        hideLoader();
        if(res.status==='success') { showToast(res.message); document.getElementById('entry-odo').value=''; document.getElementById('entry-amount').value=''; fetchInitData(); }
        else showToast(res.message, 'error');
    }

    function renderHistory() {
        let html = '';
        globalHistory.forEach(h => {
            const isFuel = h.logType === 'FUELING';
            const icon = isFuel ? '⛽' : '⚠️';
            const color = isFuel ? 'var(--accent)' : 'var(--warning)';
            const desc = isFuel ? `₹${h.amount} (${parseFloat(h.liters).toFixed(2)} L)` : 'Reserve Hit';
            html += `<div class="card" style="border-left-color:${color};"><div class="edit-badge" onclick="openEdit('${h.logId}')">Edit</div>
            <p style="margin:0 0 4px;font-size:11px;color:var(--text-muted);">${h.date} | ${h.time} | ${h.loggedBy}</p>
            <h4 style="color:${color};margin-bottom:6px;">${icon} ${h.odo} km</h4><p style="margin:0;font-weight:600;">${desc}</p></div>`;
        });
        document.getElementById('history-list').innerHTML = html || '<p>No records found.</p>';
    }

    function openEdit(id) {
        const log = globalHistory.find(h => h.logId === id);
        if(!log) return;
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-odo').value = log.odo;
        document.getElementById('edit-amt').value = log.logType === 'FUELING' ? log.amount : '';
        document.getElementById('edit-amt').disabled = log.logType !== 'FUELING';
        document.getElementById('edit-modal').style.display = 'flex';
    }

    async function saveEdit() {
        const id = document.getElementById('edit-id').value, odo = document.getElementById('edit-odo').value, amt = document.getElementById('edit-amt').value;
        showLoader('Saving...');
        const res = await callGoogleAPI({action:'editEntry', logId:id, odoReading:odo, amountPaid:amt});
        hideLoader(); document.getElementById('edit-modal').style.display='none';
        if(res.status==='success') { showToast('Record Updated'); fetchInitData(); } else showToast(res.message, 'error');
    }

    async function updateFuelPrice() {
        const np = document.getElementById('admin-price').value;
        if(!np) return; showLoader('Updating...');
        const res = await callGoogleAPI({action:'updatePrice', newPrice:np});
        hideLoader();
        if(res.status==='success') { showToast('Price Updated'); fetchInitData(); } else showToast(res.message, 'error');
    }

    function calculateMileage() {
        const resLogs = globalHistory.filter(h => h.logType === 'RESERVE');
        if(resLogs.length < 2) return document.getElementById('dash-mileage-sub').innerText = "Need at least 2 Reserve logs.";
        const endLog = resLogs[0], startLog = resLogs[1];
        const dist = endLog.odo - startLog.odo;
        
        let fuelUsed = 0;
        globalHistory.forEach(h => {
            if(h.logType==='FUELING' && h.rowIdx > startLog.rowIdx && h.rowIdx < endLog.rowIdx) fuelUsed += parseFloat(h.liters);
        });
        
        if(fuelUsed > 0 && dist > 0) {
            const mileage = (dist / fuelUsed).toFixed(2);
            document.getElementById('dash-mileage').innerText = `${mileage} km/l`;
            document.getElementById('dash-mileage-sub').innerText = `Based on last ${dist}km and ${fuelUsed.toFixed(2)}L`;
            document.getElementById('dash-mileage').style.color = mileage > 35 ? 'var(--success)' : 'var(--warning)';
        } else { document.getElementById('dash-mileage-sub').innerText = "Not enough fuel data between last reserves."; }
    }

    startApp();
</script>
</body>
</html>
